<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Знак SolArch: чернильный лист с янтарным запечатанным углом. Тот же путь, что
    в components/brand/seal-mark.tsx; менять знак надо в обоих местах сразу, иначе
    вкладка и шапка разойдутся.

    Вариант один на любую тему вкладки, светлую и тёмную. Второй файл под тёмную
    полосу вкладок пробовали и убрали: он выходил белым, а белый знак — уже не знак
    SolArch, а его негатив. На тёмной полосе лист читается силуэтом, а узнаётся
    по янтарному углу: он одинаково виден на обоих фонах.

    Ни currentColor, ни переменных темы здесь нет: CSS сайта до вкладки не доходит,
    поэтому цвета выписаны шестнадцатеричными значениями токенов foreground и seal.

    ВНИМАНИЕ: SVG разбирается как строгий XML, и два дефиса подряд внутри комментария
    делают файл невалидным целиком. Имена токенов поэтому пишем без ведущих дефисов:
    с ними браузер молча отказывался рисовать иконку и оставлял в табе прежнюю.
  -->
  <path fill="#131c2b" d="M4 1.5H12a1.25 1.25 0 0 1 1.25 1.25V13.25a1.25 1.25 0 0 1-1.25 1.25H4a1.25 1.25 0 0 1-1.25-1.25V2.75A1.25 1.25 0 0 1 4 1.5Z"/>
  <path fill="#ed9e20" d="M8.75 1.5H12a1.25 1.25 0 0 1 1.25 1.25V6Z"/>
</svg>
