<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolArch — Marketplace</title>
    <!--
      Тема применяется до первой отрисовки. Если сделать это в React, тёмная тема
      получит вспышку светлого фона на каждой загрузке. Ключ и логика совпадают
      с src/lib/theme.ts — менять их нужно вместе.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('solarch.theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* localStorage недоступен — остаётся светлая тема. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
