[workspace]
members = ["crates/solarch-core", "crates/solarch-cli", "apps/viewer/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "=0.1.23"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2"
sha2 = "0.10.9"
zeroize = "1.8"
hkdf = "0.12.4"
serde_jcs = "0.2.0"
base64 = "0.22.1"
focaccia = "=1.4.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
bs58 = "0.5.1"
time = "=0.3.47"
quick-xml = "=0.42.0"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "aes"] }
getrandom = "=0.3.4"
