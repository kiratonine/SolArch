services:
  postgres:
    image: postgres:16-alpine
    container_name: solarch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-solarch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarch -d solarch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
